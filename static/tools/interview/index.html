<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>面试备战 · 统一入口</title>
<style>
/* ============================================================
   统一外壳
   左侧一级导航（三个板块）+ 右侧各板块原生界面
   各板块样式已作用域化到 [data-sec="X"]，互不干扰
   ============================================================ */
:root{
  --rail-w:150px;
  --rail-bg:#141a22;
  --rail-fg:#8b97a8;
  --rail-fg-on:#ffffff;
  --serif:"Songti SC","Noto Serif SC",Georgia,serif;
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --mono:"Cascadia Code","SF Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);overflow:hidden;
  background:#0f141b;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---------------- 一级导航（左侧竖条） ---------------- */
#rail{
  position:fixed;left:0;top:0;bottom:0;width:var(--rail-w);z-index:200;
  background:var(--rail-bg);display:flex;flex-direction:column;
  border-right:1px solid rgba(255,255,255,.07);
}
.rail-head{
  padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.07);
}
.rail-head b{
  display:block;font-family:var(--serif);font-size:17px;font-weight:700;color:#f2f4f7;
  letter-spacing:.01em;line-height:1.3;
}
.rail-head b em{font-style:normal;color:var(--rail-accent,#e0766a)}
.rail-head span{
  display:block;font-size:9.5px;color:#5a6577;letter-spacing:.16em;
  text-transform:uppercase;margin-top:6px;
}
.rail-nav{flex:1;padding:12px 0}
.rail-btn{
  width:100%;display:block;text-align:left;padding:12px 16px;
  border-left:3px solid transparent;transition:all .15s;
}
.rail-btn:hover{background:rgba(255,255,255,.05)}
.rail-btn .rn{
  display:block;font-size:13.5px;font-weight:600;color:var(--rail-fg);transition:color .15s;
  letter-spacing:.01em;
}
.rail-btn .rd{
  display:block;font-size:10px;color:#4d5768;margin-top:3px;
  font-family:var(--mono);letter-spacing:.02em;
}
.rail-btn:hover .rn{color:#d6dbe3}
body[data-sec="algo"]  .rail-btn[data-go="algo"],
body[data-sec="kaoda"] .rail-btn[data-go="kaoda"],
body[data-sec="iv"]    .rail-btn[data-go="iv"],
body[data-sec="bagu"]  .rail-btn[data-go="bagu"],
body[data-sec="shousi"] .rail-btn[data-go="shousi"]{
  background:linear-gradient(90deg,rgba(255,255,255,.08),transparent);
  border-left-color:var(--rail-accent,#e0766a);
}
body[data-sec="algo"]  .rail-btn[data-go="algo"]  .rn,
body[data-sec="kaoda"] .rail-btn[data-go="kaoda"] .rn,
body[data-sec="iv"]    .rail-btn[data-go="iv"]    .rn,
body[data-sec="bagu"]  .rail-btn[data-go="bagu"]  .rn,
body[data-sec="shousi"] .rail-btn[data-go="shousi"] .rn{color:var(--rail-fg-on)}
body[data-sec="algo"]  .rail-btn[data-go="algo"]  .rd,
body[data-sec="kaoda"] .rail-btn[data-go="kaoda"] .rd,
body[data-sec="iv"]    .rail-btn[data-go="iv"]    .rd,
body[data-sec="bagu"]  .rail-btn[data-go="bagu"]  .rd,
body[data-sec="shousi"] .rail-btn[data-go="shousi"] .rd{color:var(--rail-accent,#e0766a)}

.rail-foot{
  padding:12px 16px 16px;border-top:1px solid rgba(255,255,255,.07);
  font-size:10px;color:#4a5464;line-height:1.6;font-family:var(--mono);
}

/* ---------------- 板块容器 ---------------- */
#stage{position:fixed;inset:0 0 0 var(--rail-w);overflow:hidden}
.pane{position:absolute;inset:0;overflow:hidden}
.pane[hidden]{display:none}
.root{position:absolute;inset:0;overflow:hidden}

/* 按需加载时的占位 */
.lz{
  position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;
  align-items:center;justify-content:center;color:#8a93a3;
  font-size:13px;font-family:var(--sans);letter-spacing:.02em;
}
.lz::before{
  content:"";width:22px;height:22px;border-radius:50%;
  border:2px solid rgba(138,147,163,.28);border-top-color:#8a93a3;
  animation:lzspin .8s linear infinite;
}
.lz.err{color:#c4553f}
.lz.err::before{display:none}
@keyframes lzspin{to{transform:rotate(360deg)}}

/* 各板块的主题色（供外壳读取） */
body[data-sec="algo"]  {--rail-accent:#c4553f}
body[data-sec="kaoda"] {--rail-accent:#d98b6a}
body[data-sec="iv"]    {--rail-accent:#6a9fd8}

/* ============================================================
   移动端：左侧竖条 → 底部标签栏
   5 个板块正好适合底部导航；内容区拿回整屏宽度
   ============================================================ */
@media(max-width:900px){
  :root{--rail-w:0px;--tabbar-h:56px}

  #rail{
    top:auto;bottom:0;left:0;right:0;width:100%;
    flex-direction:row;align-items:stretch;
    border-right:none;border-top:1px solid rgba(255,255,255,.10);
    padding-bottom:env(safe-area-inset-bottom,0px);
    background:rgba(20,26,34,.97);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    box-shadow:0 -6px 24px rgba(0,0,0,.28);
  }
  .rail-head,.rail-foot{display:none}
  .rail-nav{
    display:flex;flex:1;height:var(--tabbar-h);padding:0;
  }
  .rail-btn{
    flex:1 1 0;min-width:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;
    padding:0 2px;border-left:none;border-top:2px solid transparent;
    background:none;text-align:center;
  }
  .rail-btn:hover{background:none}
  .rail-btn:active{background:rgba(255,255,255,.06)}
  .rail-btn .rn{
    display:block;font-size:11.5px;font-weight:600;line-height:1.2;
    letter-spacing:0;white-space:nowrap;color:#79859a;
  }
  .rail-btn .rd{display:none}

  /* 激活态：顶部 2px 指示条 + 文字高亮 */
  body[data-sec="algo"]   .rail-btn[data-go="algo"],
  body[data-sec="kaoda"]  .rail-btn[data-go="kaoda"],
  body[data-sec="iv"]     .rail-btn[data-go="iv"],
  body[data-sec="bagu"]   .rail-btn[data-go="bagu"],
  body[data-sec="shousi"] .rail-btn[data-go="shousi"]{
    background:linear-gradient(180deg,rgba(255,255,255,.10),transparent 70%);
  }
  body[data-sec="algo"]   .rail-btn[data-go="algo"],
  body[data-sec="kaoda"]  .rail-btn[data-go="kaoda"],
  body[data-sec="iv"]     .rail-btn[data-go="iv"],
  body[data-sec="bagu"]   .rail-btn[data-go="bagu"],
  body[data-sec="shousi"] .rail-btn[data-go="shousi"]{border-top-color:var(--rail-accent,#e0766a)}
  body[data-sec="algo"]   .rail-btn[data-go="algo"]   .rn,
  body[data-sec="kaoda"]  .rail-btn[data-go="kaoda"]  .rn,
  body[data-sec="iv"]     .rail-btn[data-go="iv"]     .rn,
  body[data-sec="bagu"]   .rail-btn[data-go="bagu"]   .rn,
  body[data-sec="shousi"] .rail-btn[data-go="shousi"] .rn{color:#fff;font-weight:700}

  /* 内容区：占满宽度，底部让出标签栏 */
  #stage{inset:0 0 calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px)) 0}
}

/* 更窄的机型（iPhone SE 一类）：字号再收一档 */
@media(max-width:380px){
  .rail-btn .rn{font-size:10.5px}
}
</style>

<!-- ============ 各板块样式（构建时注入，已作用域化） ============ -->
<style data-for="algo">
[data-sec="algo"]{
  --paper:#f7f4ec;
  --paper-2:#fffdf8;
  --paper-3:#efe9dc;
  --ink:#1c1a17;
  --ink-2:#4a443c;
  --ink-3:#8a8175;
  --rule:#ded5c4;
  --rule-2:#e8e1d3;
  --vermillion:#b23a2e;
  --vermillion-pale:#f4e4e0;
  --jade:#3d6b52;
  --jade-pale:#e3ece5;
  --amber:#8a6a1f;
  --code-bg:#211f1c;
  --code-fg:#e8e2d4;
  --code-dim:#8c8478;
  --code-key:#d4a26a;
  --code-str:#9bbf8a;
  --code-com:#7a8a6a;
  --code-num:#d98b6a;
  --code-fn:#c4a3d4;

  --serif:"Songti SC","SimSun","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
  --mono:"Cascadia Code","SF Mono",Consolas,"DejaVu Sans Mono",monospace;

  --sb:300px;
  --shadow:0 1px 2px rgba(28,26,23,.05),0 8px 24px -12px rgba(28,26,23,.14);
}
[data-sec="algo"] *{box-sizing:border-box;margin:0;padding:0}
[data-sec="algo"], [data-sec="algo"]{height:100%}
[data-sec="algo"]{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  display:flex;
  overflow:hidden;
}
[data-sec="algo"] ::selection{background:var(--vermillion-pale);color:var(--vermillion)}
[data-sec="algo"] button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
[data-sec="algo"] a{color:var(--vermillion);text-decoration:none;border-bottom:1px solid rgba(178,58,46,.3)}
[data-sec="algo"] a:hover{border-bottom-color:var(--vermillion)}
[data-sec="algo"] aside{
  width:var(--sb);flex:0 0 var(--sb);height:100vh;
  background:var(--paper-3);
  border-right:1px solid var(--rule);
  display:flex;flex-direction:column;
}
[data-sec="algo"] .sb-head{padding:22px 20px 16px;border-bottom:1px solid var(--rule)}
[data-sec="algo"] .sb-title{
  font-family:var(--serif);font-size:23px;font-weight:700;letter-spacing:.02em;
  line-height:1.25;
}
[data-sec="algo"] .sb-title em{font-style:normal;color:var(--vermillion)}
[data-sec="algo"] .sb-sub{font-size:11.5px;color:var(--ink-3);letter-spacing:.08em;margin-top:5px;text-transform:uppercase}
[data-sec="algo"] .progress{padding:14px 20px 16px;border-bottom:1px solid var(--rule)}
[data-sec="algo"] .progress-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink-2);margin-bottom:7px}
[data-sec="algo"] .progress-num{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--ink)}
[data-sec="algo"] .progress-num b{color:var(--jade)}
[data-sec="algo"] .bar{height:5px;background:var(--rule);border-radius:3px;overflow:hidden}
[data-sec="algo"] .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--jade),#5a8b6d);border-radius:3px;transition:width .45s cubic-bezier(.2,.8,.2,1);width:0}
[data-sec="algo"] .search{padding:12px 16px;border-bottom:1px solid var(--rule)}
[data-sec="algo"] .search input{
  width:100%;padding:9px 12px;font-size:13.5px;font-family:var(--sans);

}

[data-sec="algo"] .nav{flex:1;overflow-y:auto;padding:8px 0 40px}

[data-sec="algo"] .nav::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
[data-sec="algo"] .grp{margin-top:6px}
[data-sec="algo"] .grp-btn{
  width:100%;display:flex;align-items:center;gap:9px;padding:9px 20px;
  font-size:13.5px;font-weight:600;letter-spacing:.01em;text-align:left;
  transition:background .13s;
}
[data-sec="algo"] .grp-btn:hover{background:rgba(255,255,255,.55)}
[data-sec="algo"] .grp-icon{color:var(--vermillion);font-size:13px;width:14px;flex:0 0 14px;text-align:center}
[data-sec="algo"] .grp-name{flex:1;font-family:var(--serif);font-size:14.5px}
[data-sec="algo"] .grp-cnt{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;letter-spacing:.02em}
[data-sec="algo"] .grp-items{display:none;padding:2px 0 6px}
[data-sec="algo"] .grp.open .grp-items{display:block}
[data-sec="algo"] .item{
  width:100%;display:flex;align-items:center;gap:9px;padding:5.5px 20px 5.5px 43px;
  font-size:13px;text-align:left;color:var(--ink-2);transition:background .12s,color .12s;
}
[data-sec="algo"] .item:hover{background:rgba(255,255,255,.6);color:var(--ink)}

[data-sec="algo"] .tick{
  width:14px;height:14px;flex:0 0 14px;border:1.5px solid var(--rule);border-radius:3px;
  display:grid;place-items:center;font-size:10px;color:#fff;transition:all .15s;
}
[data-sec="algo"] .item.checked .tick{background:var(--jade);border-color:var(--jade)}

[data-sec="algo"] main::-webkit-scrollbar-thumb{background:var(--rule);border-radius:6px;border:3px solid var(--paper)}
[data-sec="algo"] .article{max-width:900px;margin:0 auto;padding:52px 56px 140px}

}

[data-sec="algo"] .hl-str{color:var(--code-str)}
[data-sec="algo"] .hl-com{color:var(--code-com);font-style:italic}

<!-- ============ 各板块渲染逻辑（构建时注入） ============ -->
<script>
(function(){
/* ============================================================
   板块一：算法题解
   逻辑与「题解页面」源实现一致，仅把全局查询改为 root 作用域
   ============================================================ */
window.__RENDER_ALGO__ = function (root, DATA) {
  const { GROUPS, PROBLEMS, TEACHING, STATS } = DATA;

  const $ = (id) => root.querySelector('#' + id);
  const $$ = (sel) => Array.from(root.querySelectorAll(sel));

  /* ---------------- 布局 ---------------- */
  root.innerHTML = `
    <button class="menu-btn" id="menuBtn" title="目录">☰</button>
    <aside id="sb">
      <div class="sb-head">
        <div class="sb-title">Hot 100 <em>题解</em></div>
        <div class="sb-sub">LeetCode · ACM 模式 · Go · 官方 100 + 补充 3 + 扩展 21</div>
      </div>
      <div class="progress">
        <div class="progress-top">
          <span>学习进度</span>
          <span class="progress-num"><b id="pDone">0</b> <span class="pt">/ <span id="pTotal">0</span></span></span>
        </div>
        <div class="bar"><i id="pBar"></i></div>
      </div>
      <div class="search">
        <input id="q" type="search" placeholder="搜索题号或题名…" autocomplete="off">
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>
    <main id="main">
      <div class="article" id="view"></div>
    </main>`;

  /* ---------------- 状态 ---------------- */
  const LS_KEY = 'hot100-progress-v1';
  const readLS = () => { try { return new Set(JSON.parse(localStorage.getItem(LS_KEY) || '[]')); } catch (e) { return new Set(); } };
  let checked = readLS();
  const saveLS = () => { try { localStorage.setItem(LS_KEY, JSON.stringify([...checked])); } catch (e) {} };

  const all = Object.values(PROBLEMS).sort((a, b) => a.lc - b.lc);
  const byGroup = {};
  for (const g of GROUPS) byGroup[g.id] = all.filter((p) => p.group === g.id);
  const SUPPLEMENT = new Set([26, 27, 88]);
  let current = all.find((p) => p.status === 'done') || all[0];
  let query = '';
  const openGroups = new Set([GROUPS[0].id]);

  /* ---------------- 语法高亮 ---------------- */
  const GO_KW = /\b(package|import|func|var|const|type|struct|interface|map|chan|go|defer|return|if|else|for|range|switch|case|default|break|continue|select|nil|true|false|make|new|append|len|cap|copy|delete|string|int|int64|float64|bool|byte|rune|error|any)\b/g;
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function hlGo(src) {
    let s = esc(src);
    const slots = [];
    const keep = (html) => { slots.push(html); return `\u0000PH${'x'.repeat(slots.length)}\u0000`; };
    s = s.replace(/\/\/[^\n]*/g, (m) => keep(`<span class="hl-com">${m}</span>`));
    s = s.replace(/"(?:[^"\\]|\\.)*"/g, (m) => keep(`<span class="hl-str">${m}</span>`));
    s = s.replace(/`[^`]*`/g, (m) => keep(`<span class="hl-str">${m}</span>`));
    s = s.replace(GO_KW, '<span class="hl">$1</span>');
    s = s.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="hl-num">$1</span>');
    s = s.replace(/\b([a-zA-Z_]\w*)(\()/g, '<span class="hl-fn">$1</span>$2');
    return s.replace(/\u0000PH(x+)\u0000/g, (_, xs) => slots[xs.length - 1] ?? '');
  }

  /* ---------------- 侧栏 ---------------- */
  function renderNav() {
    const q = query.trim().toLowerCase();
    const parts = [];
    for (const g of GROUPS) {
      const items = byGroup[g.id] || [];
      const shown = q ? items.filter((p) => String(p.lc).includes(q) || p.title.toLowerCase().includes(q)) : items;
      if (q && shown.length === 0) continue;
      const doneN = items.filter((p) => checked.has(p.lc)).length;
      const isOpen = q ? true : openGroups.has(g.id);
      parts.push(`<div class="grp ${isOpen ? 'open' : ''}" data-g="${g.id}">
        <button class="grp-btn" data-toggle="${g.id}">
          <span class="grp-icon">${g.icon}</span>
          <span class="grp-name">${g.name}</span>
          <span class="grp-cnt">${doneN}/${items.length}</span>
        </button>
        <div class="grp-items">`);
      for (const p of shown) {
        const isChecked = checked.has(p.lc);
        const cur = current && p.lc === current.lc;
        parts.push(`<button class="item ${isChecked ? 'checked' : ''} ${cur ? 'cur' : ''}" data-lc="${p.lc}">
          <span class="tick">${isChecked ? '✓' : ''}</span>
          <span class="lc">${p.lc}</span>
          <span class="tt">${p.title}</span>
          ${p.status === 'todo' ? '<span class="no-code">—</span>' : ''}
        </button>`);
      }
      parts.push(`</div></div>`);
    }
    $('nav').innerHTML = parts.join('');
    updateProgress();
  }

  function updateProgress() {
    const doneN = all.filter((p) => checked.has(p.lc)).length;
    $('pDone').textContent = doneN;
    $('pTotal').textContent = all.length;
    $('pBar').style.width = (doneN / all.length * 100).toFixed(1) + '%';
  }

  /* ---------------- 详情 ---------------- */
  const DIFF = { '简单': 'easy', '中等': 'mid', '困难': 'hard' };

  function codeBlock(code, opt) {
    const o = opt || {};
    const lang = o.lang || 'Go';
    const title = o.title || '';
    const id = 'cb' + Math.random().toString(36).slice(2, 8);
    return `<div class="code-wrap">
      <div class="code-bar">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="lang">${lang}${title ? ' · ' + title : ''}</span>
        <span class="spacer"></span>
        <button data-copy="${id}">复制</button>
      </div>
      <pre id="${id}">${hlGo(code)}</pre>
    </div>`;
  }

  function renderView() {
    const v = $('view');
    const p = current;
    if (!p) {
      v.innerHTML = `<div class="empty"><div class="empty-in"><div class="big">100</div><h2>选择一道题开始</h2><p>从左侧目录选择题目。</p></div></div>`;
      return;
    }
    const g = GROUPS.find((x) => x.id === p.group);
    const isChecked = checked.has(p.lc);
    const sup = SUPPLEMENT.has(p.lc);

    const head = `
      <div class="crumb">
        <span class="g">${g.icon} ${g.name}</span>
        <span class="sep">/</span>
        <span>LeetCode ${p.lc}</span>
      </div>
      <div class="head">
        <h1>${p.title}</h1>
        <span class="num">#${p.lc}</span>
      </div>
      <div class="meta">
        <span class="chip ${DIFF[p.difficulty] || 'mid'}">${p.difficulty}</span>
        ${sup ? '<span class="chip sup">基础补充题</span>' : ''}
        ${p.status === 'done' ? '<span class="chip ok">✓ 代码已验证</span>' : '<span class="chip pending">代码待补</span>'}
        <button class="chip ${isChecked ? 'ok' : 'pending'}" data-check="${p.lc}" style="cursor:pointer">${isChecked ? '✓ 已掌握' : '标记为已掌握'}</button>
      </div>`;

    if (p.status === 'todo') {
      v.innerHTML = head + `
        <section>
          <div class="pending-box">
            <div class="pb-ico">◌</div>
            <h3>这题的代码还没生成</h3>
            <p>当前已完成 <b>${STATS.done}</b> 题的 ACM 模式代码与验证。</p>
            <p>剩余 <b>${STATS.todo}</b> 题在后续批次中补充。</p>
          </div>
        </section>
        <section>
          <h2>这一组的套路</h2>
          <div class="note tip">
            <div class="note-label">识别信号</div>
            <p style="margin:0">${g.when}</p>
          </div>
          <p><b>核心思路：</b>${g.tagline}</p>
        </section>`;
      bindCopy();
      return;
    }

    const ioBox = (p.sampleIn && p.sampleIn.length) ? `
      <div class="io">
        <div class="io-box"><div class="t">样例输入</div><pre>${esc(p.sampleIn.join('\n'))}</pre></div>
        <div class="io-box"><div class="t">样例输出</div><pre>${esc((p.sampleOut || []).join('\n'))}</pre></div>
      </div>` : '';

    const inOutList = (arr) => (arr || []).map((x) => `<li>${esc(x)}</li>`).join('');
    const teach = TEACHING[p.lc];

    v.innerHTML = head + `
      ${teach ? teachBlock(teach) : ''}

      <section>
        <h2>识别信号 <span class="hint">看到什么该想到这个套路</span></h2>
        <div class="signal">
          <span class="s-icon">◈</span>
          <div>${g.when.replace(/^(.{0,4}?)(题目|看到|求)/, '<b>$1$2</b>')}</div>
        </div>
        <div class="note">
          <div class="note-label">本组核心</div>
          <p style="margin:0"><b>${g.name}</b> —— ${g.tagline}</p>
        </div>
      </section>

      <section>
        <h2>输入输出 <span class="hint">ACM 模式，自己读写</span></h2>
        <h3>输入格式</h3>
        <ul>${inOutList(p.input)}</ul>
        <h3>输出格式</h3>
        <ul>${inOutList(p.output)}</ul>
        ${ioBox}
      </section>

      <section>
        <h2>解法代码 <span class="hint">ACM 模式 · 已验证</span></h2>
        ${p.helpers ? `<details style="margin-bottom:16px"><summary class="fold">▸ 展开前置代码（结构体 / 辅助函数）</summary>${codeBlock(p.helpers, { title: '前置定义' })}</details>` : ''}
        ${codeBlock(p.algo, { title: 'main.go 主体' })}
        <div class="note tip">
          <div class="note-label">运行</div>
          <p style="margin:0;font-family:var(--mono);font-size:12.5px">
            cd ${p.dir} &amp;&amp; go run main.go &lt; input.txt
          </p>
        </div>
      </section>

      <section>
        <h2>完整代码位置</h2>
        <p>完整可运行文件（含输入读取骨架）在：</p>
        <div class="note">
          <p style="margin:0;font-family:var(--mono);font-size:12.5px">
            算法练习-acm\\${p.dir}\\<br>
            ├── main.go<br>
            ├── input.txt<br>
            └── expected.txt
          </p>
        </div>
      </section>`;

    bindCopy();
    bindFolds();
  }

  /* ---------------- 教学区块 ---------------- */
  function highlightTeaching(el) {
    el.querySelectorAll('pre.teach-code').forEach((pre) => {
      const lang = pre.dataset.lang || '';
      const codeEl = pre.querySelector('code');
      if (!codeEl) return;
      const raw = codeEl.textContent;
      if (lang === 'go' || (!lang && /func |package |:=/.test(raw))) pre.innerHTML = hlGo(raw);
      pre.classList.add('hl-done');
    });
  }

  function teachBlock(t) {
    const secLabel = { '①': '识别信号', '②': '思路推导', '③': '图解', '④': '代码', '⑤': '为什么这样对', '⑥': '易错点', '⑦': '复杂度', '⑧': '举一反三' };
    const parts = [];
    if (t.groupIntro) {
      parts.push(`<details class="teach-fold grp-intro">
        <summary class="fold">▸ ${t.groupIntro.title}</summary>
        <div class="teach-body">${t.groupIntro.html}</div>
      </details>`);
    }
    if (t.opening) parts.push(`<div class="teach-open">${t.opening}</div>`);
    for (const s of t.sections) {
      const known = secLabel[s.marker];
      const open = s.marker === '①' ? ' open' : '';
      const title = `${s.marker} ${s.name || known || ''}`;
      parts.push(`<details class="teach-fold" data-marker="${s.marker}"${open}>
        <summary class="fold">${title}</summary>
        <div class="teach-body">${s.html}</div>
      </details>`);
    }
    return `<section class="teach">
      <h2>题解与教学 <span class="hint">${t.doc.replace(/^题解-/, '').replace(/\.md$/, '')} · ${t.sections.length} 个小节</span></h2>
      <div class="teach-note">点标题展开。建议顺序：<b>先看①识别信号</b> → 自己想 20–30 分钟 → 再看②思路推导 → 最后对④代码。</div>
      ${parts.join('\n')}
    </section>`;
  }

  function bindFolds() {
    $$('details.teach-fold').forEach((d) => {
      const body = d.querySelector('.teach-body');
      if (body) highlightTeaching(body);
    });
  }

  function bindCopy() {
    $$('[data-copy]').forEach((btn) => {
      btn.onclick = async () => {
        const el = root.querySelector('#' + btn.dataset.copy);
        if (!el) return;
        const txt = el.innerText;
        try { await navigator.clipboard.writeText(txt); } catch (e) {
          const ta = document.createElement('textarea');
          ta.value = txt; document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); ta.remove();
        }
        const old = btn.textContent; btn.textContent = '已复制';
        setTimeout(() => { btn.textContent = old; }, 1200);
      };
    });
  }

  /* ---------------- 事件 ---------------- */
  $('nav').addEventListener('click', (e) => {
    const toggle = e.target.closest('[data-toggle]');
    if (toggle) {
      const id = toggle.dataset.toggle;
      if (openGroups.has(id)) openGroups.delete(id); else openGroups.add(id);
      renderNav();
      return;
    }
    const item = e.target.closest('[data-lc]');
    if (item) {
      const lc = +item.dataset.lc;
      current = all.find((p) => p.lc === lc);
      $('sb').classList.remove('open');
      renderNav(); renderView();
      $('main').scrollTop = 0;
    }
  });

  $('view').addEventListener('click', (e) => {
    const c = e.target.closest('[data-check]');
    if (!c) return;
    const lc = +c.dataset.check;
    if (checked.has(lc)) checked.delete(lc); else checked.add(lc);
    saveLS(); renderNav(); renderView();
  });

  $('q').addEventListener('input', (e) => { query = e.target.value; renderNav(); });
  $('menuBtn').onclick = () => $('sb').classList.toggle('open');

  root.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') $('sb').classList.remove('open');
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault(); $('q').focus();
    }
  });

  /* ---------------- 启动 ---------------- */
  openGroups.add(current.group);
  renderNav();
  renderView();
};

(window.__PENDING__ = window.__PENDING__ || {});
window.__PENDING__['algo'] = function(){ window.__RENDER_ALGO__(document.getElementById('rootAlgo'), window.__DATA_ALGO__); };
})();

<script>
(function(){
/* ============================================================
   板块二：项目拷打
   逻辑与「拷打文档」源实现一致，仅把全局查询改为 root 作用域
   ============================================================ */
window.__RENDER_KAODA__ = function (root, DATA) {
  const PROJS = ['gcfeed', 'oncall'];
  const NAMES = { gcfeed: 'GCFeed', oncall: 'OnCall Agent' };

  const $ = (id) => root.querySelector('#' + id);
  const $$ = (sel) => Array.from(root.querySelectorAll(sel));

  /* ---------------- 布局 ---------------- */
  root.innerHTML = `
    <button class="menu-btn" id="menuBtn">☰</button>
    <aside id="sb">
      <div class="sb-head">
        <div class="sb-title">项目<em>拷打</em>文档</div>
        <div class="sb-sub">Interrogation Notes</div>
      </div>
      <div class="proj" id="projBar"></div>
      <div class="search">
        <input id="q" type="search" placeholder="搜索问题或关键词…" autocomplete="off">
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>
    <main id="main">
      <div class="wrap" id="view"></div>
    </main>`;

  /* ---------------- 迷你 Markdown ---------------- */
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function inline(s) {
    let t = esc(s);
    const codes = [];
    t = t.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000C${codes.length - 1}\u0000`; });
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    t = t.replace(/\u0000C(\d+)\u0000/g, (_, i) => `<code>${esc(codes[+i])}</code>`);
    return t;
  }
  function md(src) {
    const L = String(src).split('\n');
    const out = [];
    let i = 0;
    while (i < L.length) {
      const line = L[i];
      if (/^\s*```/.test(line)) {
        const buf = []; i++;
        while (i < L.length && !/^\s*```/.test(L[i])) { buf.push(L[i]); i++; }
        i++;
        out.push(`<pre>${esc(buf.join('\n'))}</pre>`);
        continue;
      }
      if (/^\|.*\|/.test(line) && i + 1 < L.length && /^\|[\s:|-]+\|/.test(L[i + 1])) {
        const rows = [];
        while (i < L.length && /^\|.*\|/.test(L[i])) { rows.push(L[i]); i++; }
        const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
        let h = '<div class="tw"><table><thead><tr>' + cells(rows[0]).map((c) => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>';
        for (const r of rows.slice(2)) h += '<tr>' + cells(r).map((c) => `<td>${inline(c)}</td>`).join('') + '</tr>';
        out.push(h + '</tbody></table></div>');
        continue;
      }
      if (/^>\s?/.test(line)) {
        const buf = [];
        while (i < L.length && /^>/.test(L[i])) { buf.push(L[i].replace(/^>\s?/, '')); i++; }
        out.push(`<div class="warn">${md(buf.join('\n'))}</div>`);
        continue;
      }
      if (/^\s*[-*]\s+/.test(line) || /^\s*\d+\.\s+/.test(line)) {
        const ord = /^\s*\d+\.\s+/.test(line);
        const items = [];
        while (i < L.length && (/^\s*[-*]\s+/.test(L[i]) || /^\s*\d+\.\s+/.test(L[i]))) {
          items.push(`<li>${inline(L[i].replace(/^\s*(?:[-*]|\d+\.)\s+/, ''))}</li>`);
          i++;
        }
        out.push(ord ? `<ol>${items.join('')}</ol>` : `<ul>${items.join('')}</ul>`);
        continue;
      }
      if (!line.trim()) { i++; continue; }
      const buf = [];
      while (i < L.length && L[i].trim() && !/^(>|\s*[-*]\s|\s*\d+\.\s|\||\s*```)/.test(L[i])) { buf.push(L[i]); i++; }
      out.push(`<p>${inline(buf.join(' '))}</p>`);
    }
    return out.join('\n');
  }

  /* ---------------- 状态 ---------------- */
  const LS_KEY = 'kaoda-state-v2';
  const loadLS = () => { try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch (e) { return {}; } };
  let state = loadLS();
  state.doneQ = state.doneQ || [];
  const saveLS = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} };
  if (!PROJS.includes(state.proj)) state.proj = 'gcfeed';
  state.openCaps = state.openCaps || [0];

  let query = '';
  const cur = () => DATA[state.proj];
  const allQ = (p) => [
    ...((p.overview && p.overview.blocks) || []).filter((b) => b.type === 'qa'),
    ...(p.capabilities || []).flatMap((c) => c.sections.flatMap((s) => s.qa || [])),
  ];

  /* ---------------- 侧栏 ---------------- */
  function renderProj() {
    $('projBar').innerHTML = PROJS.map((k) =>
      `<button data-p="${k}" class="${state.proj === k ? 'on' : ''}">${NAMES[k]}</button>`).join('');
  }

  function renderNav() {
    const p = cur();
    const q = query.trim().toLowerCase();
    const parts = [];

    const extra = [];
    if (p.notice) extra.push({ id: 'notice', t: p.notice.title, n: '!' });
    if (p.overview) extra.push({ id: 'overview', t: p.overview.title, n: '§' });

    const extraHtml = extra.filter((e) => !q || e.t.toLowerCase().includes(q)).map((e) => `
      <div class="cap"><button data-goto="${e.id}"><span class="idx">${e.n}</span><span class="txt">${e.t}</span></button></div>`).join('');

    (p.capabilities || []).forEach((c, ci) => {
      const qs = c.sections.flatMap((s) => s.qa || []);
      const shown = q ? qs.filter((x) => x.q.toLowerCase().includes(q) || JSON.stringify(x.a).toLowerCase().includes(q)) : qs;
      if (q && shown.length === 0) return;
      const isOpen = q ? true : (state.openCaps || []).includes(ci);
      const doneN = shown.filter((x) => state.doneQ.includes(x.id)).length;
      parts.push(`<div class="cap ${isOpen ? 'open' : ''}" data-cap="${ci}">
        <button data-toggle="${ci}">
          <span class="idx">${String(ci + 1).padStart(2, '0')}</span>
          <span class="txt">${esc(c.headline.slice(0, 60))}${c.headline.length > 60 ? '…' : ''}</span>
          <span class="cnt">${doneN}/${qs.length}</span>
        </button>
        <div class="qlist">`);
      for (const x of shown) {
        const isDone = state.doneQ.includes(x.id);
        parts.push(`<a href="#${x.id}" data-q="${x.id}" style="${isDone ? 'opacity:.5;text-decoration:line-through' : ''}">
          <span class="qn">${x.id.replace(/^q/, 'Q')}</span><span>${esc(x.q.replace(/^Q\d+[:：]\s*/, '').slice(0, 42))}</span></a>`);
      }
      parts.push(`</div></div>`);
    });

    $('nav').innerHTML = extraHtml + parts.join('');
  }

  /* ---------------- 主区 ---------------- */
  function renderView() {
    const p = cur();
    const v = $('view');
    const total = allQ(p).length;
    const done = allQ(p).filter((x) => state.doneQ.includes(x.id)).length;

    let h = `<div class="tools">
      <button data-act="expand">展开全部</button>
      <button data-act="collapse">收起全部</button>
      <span class="sp"></span>
      <span class="pos">${done}/${total} 已掌握</span>
    </div>`;

    h += `<div class="phead">
      <span class="tag">${p.subtitle || ''}</span>
      <h1>${esc(p.name)}</h1>
      <div class="sub">项目拷打文档 · ${total} 个问题</div>
      <div class="stack">${(p.stack || []).map((s) => `<i>${esc(s)}</i>`).join('')}</div>
    </div>`;

    if (p.notice) {
      h += `<div class="notice" id="notice"><h2>⚠ ${esc(p.notice.title)}</h2>`;
      for (const b of p.notice.blocks) h += `<div class="blk"><h3>${esc(b.h)}</h3>${md(b.p.join('\n'))}</div>`;
      h += `</div>`;
    }

    if (p.overview) {
      h += `<h2 class="sec" id="overview">${esc(p.overview.title)}</h2>`;
      for (const b of p.overview.blocks) h += qaHtml(b);
    }

    (p.capabilities || []).forEach((c, ci) => {
      h += `<div class="cap-head" id="cap${ci}">
        <span class="no">亮点 ${String(ci + 1).padStart(2, '0')}</span>
        <div class="hl">${esc(c.headline)}</div>
      </div>`;
      for (const s of c.sections) {
        h += `<h3 class="cap-sec" data-k="${esc(s.h)}"><span class="dot"></span>${esc(s.h)}</h3>`;
        for (const x of s.qa || []) h += qaHtml(x);
      }
    });

    v.innerHTML = h;
    bindView();
  }

  function qaHtml(x) {
    const isDone = state.doneQ.includes(x.id);
    let inner = '';
    const ansLines = x.a || [];
    const sayIdx = ansLines.findIndex((l) => /可直接说/.test(l));
    const ptsIdx = ansLines.findIndex((l) => /要答的点/.test(l));

    if (sayIdx >= 0) {
      const end = ptsIdx > sayIdx ? ptsIdx : ansLines.length;
      const sayBody = ansLines.slice(sayIdx + 1, end).filter((l) => !/^\s*$/.test(l));
      inner += `<div class="say">${md(sayBody.join('\n'))}</div>`;
    }
    if (ptsIdx >= 0) {
      const pts = ansLines.slice(ptsIdx + 1).filter((l) => /^\s*[-*]\s+/.test(l));
      if (pts.length) inner += `<div class="hits"><div class="lb">要答的点</div>${md(pts.join('\n'))}</div>`;
      const other = ansLines.slice(ptsIdx + 1).filter((l) => l.trim() && !/^\s*[-*]\s+/.test(l));
      if (other.length) inner += md(other.join('\n'));
    } else if (ptsIdx < 0 && sayIdx < 0) {
      inner += md(ansLines.join('\n'));
    }
    if (x.points && x.points.length) {
      inner += `<div class="hits"><div class="lb">要答的点</div><ul>${x.points.map((p) => `<li>${inline(p)}</li>`).join('')}</ul></div>`;
    }

    return `<details class="qa" id="${x.id}" data-qid="${x.id}">
      <summary>
        <span class="mk">${x.id.replace(/^q/, 'Q')}</span>
        <span>${esc(x.q.replace(/^Q\d+[:：]\s*/, ''))}</span>
        <span class="arw">▸</span>
      </summary>
      <div class="body">${inner}
        <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--rule-2)">
          <button data-done="${x.id}" style="font-size:12px;padding:5px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--paper-2);color:${isDone ? 'var(--jade)' : 'var(--text-3)'}">
            ${isDone ? '✓ 已掌握' : '标记为已掌握'}
          </button>
        </div>
      </div>
    </details>`;
  }

  function bindView() {
    const v = $('view');
    v.querySelectorAll('[data-act]').forEach((b) => {
      b.onclick = () => {
        const open = b.dataset.act === 'expand';
        v.querySelectorAll('details.qa').forEach((d) => { d.open = open; });
      };
    });
    v.querySelectorAll('[data-done]').forEach((b) => {
      b.onclick = (e) => {
        e.preventDefault();
        const id = b.dataset.done;
        if (state.doneQ.includes(id)) state.doneQ = state.doneQ.filter((x) => x !== id);
        else state.doneQ.push(id);
        saveLS(); renderNav(); renderView();
        const el = root.querySelector('#' + id);
        if (el) { el.open = true; el.scrollIntoView({ block: 'center' }); }
      };
    });
    /* 深链（仅当 hash 属于本板块时才处理） */
    const hash = decodeURIComponent(location.hash.slice(1));
    if (hash) {
      const el = root.querySelector('#' + hash);
      if (el && el.classList.contains('qa')) {
        el.open = true;
        setTimeout(() => el.scrollIntoView({ block: 'start' }), 120);
      }
    }
  }

  /* ---------------- 事件 ---------------- */
  $('nav').addEventListener('click', (e) => {
    const tg = e.target.closest('[data-toggle]');
    if (tg) {
      const i = +tg.dataset.toggle;
      state.openCaps = state.openCaps || [];
      state.openCaps = state.openCaps.includes(i) ? state.openCaps.filter((x) => x !== i) : [...state.openCaps, i];
      saveLS(); renderNav();
      return;
    }
    const go = e.target.closest('[data-goto]');
    if (go) {
      const el = root.querySelector('#' + go.dataset.goto);
      if (el) el.scrollIntoView({ block: 'start' });
      $('sb').classList.remove('open');
    }
  });

  /* 题号链接：在导航里点击时同步渲染（原生锚点在同一滚动容器内即可工作） */
  $('nav').addEventListener('click', (e) => {
    const a = e.target.closest('[data-q]');
    if (a) $('sb').classList.remove('open');
  });

  $('projBar').addEventListener('click', (e) => {
    const b = e.target.closest('[data-p]');
    if (!b) return;
    state.proj = b.dataset.p; state.openCaps = []; saveLS();
    renderProj(); renderNav(); renderView(); $('main').scrollTop = 0;
  });

  $('q').addEventListener('input', (e) => { query = e.target.value; renderNav(); });
  $('menuBtn').onclick = () => $('sb').classList.toggle('open');
  root.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') $('sb').classList.remove('open');
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('q').focus(); }
  });

  /* ---------------- 启动 ---------------- */
  renderProj();
  renderNav();
  renderView();
};

(window.__PENDING__ = window.__PENDING__ || {});
window.__PENDING__['kaoda'] = function(){ window.__RENDER_KAODA__(document.getElementById('rootKaoda'), window.__DATA_KAODA__); };
})();
</script>
<script>
(function(){
/* ============================================================
   板块三：面试速查
   逻辑与「面试页面」源实现一致，仅把全局查询改为 root 作用域
   ============================================================ */
window.__RENDER_IV__ = function (root, DATA) {
  const { docs, stat } = DATA;

  const $ = (id) => root.querySelector('#' + id);
  const $$ = (sel) => Array.from(root.querySelectorAll(sel));
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  /* ---------------- 布局 ---------------- */
  root.innerHTML = `
    <button class="menu-btn" id="menuBtn">☰</button>
    <aside id="sb">
      <div class="sb-head">
        <div class="sb-title">${esc(DATA.title || '面试')}<em>${esc(DATA.titleEm || '速查')}</em></div>
        <div class="sb-sub">${esc(DATA.subtitle || 'Scenario & Beyond')}</div>
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="search">
        <input id="q" type="search" placeholder="搜索题目或内容…" autocomplete="off">
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>
    <main id="main">
      <div class="wrap" id="view"></div>
    </main>`;

  /* ---------------- 状态 ---------------- */
  const LS = DATA.storeKey || 'interview-page-v1';
  const load = () => { try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch (e) { return {}; } };
  const st = load();
  if (!stat.some((d) => d.key === st.doc)) st.doc = stat[0].key;
  st.openSecs = st.openSecs || {};
  let query = '';

  const curDoc = () => docs.find((d) => d.key === st.doc);
  const save = () => { try { localStorage.setItem(LS, JSON.stringify(st)); } catch (e) {} };

  /* ---------------- 侧栏 ---------------- */
  function renderTabs() {
    $('tabs').innerHTML = stat.map((d) =>
      `<button data-doc="${d.key}" class="${st.doc === d.key ? 'on' : ''}" title="${d.label} · ${d.questions} 题">${d.short}</button>`).join('');
  }

  function renderNav() {
    const doc = curDoc();
    const q = query.trim().toLowerCase();
    const html = [];

    doc.sections.forEach((s, si) => {
      const hitQ = q
        ? s.questions.filter((x) => (x.title + ' ' + x.sub.join(' ') + ' ' + s.html.replace(/<[^>]+>/g, ' ')).toLowerCase().includes(q))
        : s.questions;
      if (q && hitQ.length === 0) return;
      const open = q ? true : (st.openSecs[doc.key + ':' + si] !== false);
      html.push(`<div class="sec ${open ? 'open' : ''}" data-si="${si}">
        <button data-tog="${si}">
          <span class="caret">▶</span>
          <span class="lbl">${esc(s.title)}</span>
          <span class="num">${s.questions.length}</span>
        </button>
        <div class="qs">`);
      if (s.ownNav) {
        const sid = s.questions[0].id;
        html.push(`<a href="#${sid}" data-q="${sid}"><span class="k">§</span>${esc(s.title.slice(0, 30))}</a>`);
      } else {
        for (const x of hitQ) {
          const short = x.title.replace(/^[A-Z]?\d+(\.\d+)?[.\s]*/, '').slice(0, 34);
          const kk = x.title.split(/[.\s]/)[0];
          html.push(`<a href="#${x.id}" data-q="${x.id}"><span class="k">${esc(kk)}</span>${esc(short)}</a>`);
        }
      }
      html.push(`</div></div>`);
    });
    $('nav').innerHTML = html.join('');
  }

     单文件模式下数据已内联（__LAZY__ 为假），渲染器注册时立即执行；
     拆分模式下渲染器只登记，等 data/<sec>.js 下载完再执行，

  const DATA_VAR = {

  function run(sec) {
    if (DONE[sec] || !PENDING[sec]) return;

      DONE[sec] = true;
    } catch (e) {
      if (window.console) console.error('render ' + sec + ' failed', e);
      root.innerHTML = '<div class="lz err">渲染失败：' + (e && e.message ? e.message : e) + '</div>';
      DONE[sec] = true;
    }
  }

  function ensure(sec) {
    if (DONE[sec] || LOADING[sec]) return;
    if (window[DATA_VAR[sec]] || !window.__LAZY__) { run(sec); return; }
    LOADING[sec] = true;
    const s = document.createElement('script');
    s.src = 'data/' + sec + '.js';
    s.async = true;
    s.onload = () => { LOADING[sec] = false; run(sec); };
    s.onerror = () => {
      LOADING[sec] = false;
      const root = rootOf(sec);
      if (root) root.innerHTML = '<div class="lz err">数据加载失败，检查网络后刷新</div>';
    };
    document.head.appendChild(s);
  }

  /* 渲染器注册入口 */
  window.__REGISTER__ = (sec, fn) => {
    PENDING[sec] = fn;
    if (!window.__LAZY__) run(sec);
  };

  function show(sec, remember) {
    if (!SECS.includes(sec)) sec = 'algo';
    document.body.dataset.sec = sec;
    for (const s of SECS) {
      const pane = document.getElementById('pane-' + s);
      if (pane) pane.hidden = (s !== sec);
    }
    ensure(sec);
    /* 通知各板块「自己被激活了」——用于懒渲染或重算尺寸 */
    window.dispatchEvent(new CustomEvent('secchange', { detail: { sec } }));
    if (remember !== false) { try { localStorage.setItem(KEY, sec); } catch (e) {} }
  }

  document.getElementById('rail').addEventListener('click', (e) => {
    const b = e.target.closest('[data-go]');
    if (b) show(b.dataset.go);
  });

  let last = 'algo';
  try { last = localStorage.getItem(KEY) || 'algo'; } catch (e) {}
  show(last, false);
  window.__showSec = show;

  /* 键盘：1/2/3 切换板块 */
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '1') show('algo');
    if (e.key === '2') show('kaoda');
    if (e.key === '3') show('iv');
    if (e.key === '4') show('bagu');
    if (e.key === '5') show('shousi');
  });
})();
</script>
</body>
</html>
